<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project MATH-LARO: Interactive Worksheets and Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#14213d;--mute:#52607c;--line:#d9deea;--panel:#f1f4fa;--ok:#12805c;--bad:#c92a2a;--amb:#f2a900;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--ink:#eef1f8;--mute:#aab4cc;--line:#2a3654;--panel:#18223b;--ok:#4fd1a5;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#0f1729;--ink:#eef1f8;--mute:#aab4cc;--line:#2a3654;--panel:#18223b;--ok:#4fd1a5;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.55}
header{background:#14213d;color:#fff;padding:28px 20px 22px;border-bottom:6px solid var(--amb)}
header div,main{max-width:860px;margin:0 auto}
h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;font-weight:800}
h1 b{color:var(--amb)}
header p{margin:8px 0 0;color:#c9d3ea;font-size:.92rem}
main{padding:16px 16px 64px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tab{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:6px 14px;font:600 .82rem Lexend,sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--c);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 14px;font-size:.88rem;color:var(--mute)}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.btn{border:0;border-radius:8px;padding:8px 14px;font:600 .85rem Lexend,sans-serif;cursor:pointer;background:#14213d;color:#fff}
.btn.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.banner{background:var(--c);color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center}
.banner .no{font-size:2.6rem;font-weight:800;line-height:1;background:#14213d;border-radius:10px;padding:8px 14px}
.banner small{opacity:.9}.banner h2{margin:0;font-size:1.5rem}
.id{display:flex;gap:10px;margin:12px 0}
.id input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:6px 2px}
h3{margin:22px 0 8px;color:var(--c);border-bottom:2px solid var(--c);padding-bottom:3px;font-size:1.05rem}
.mat{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.mat label{display:flex;gap:10px;padding:8px 12px;background:var(--panel);border-radius:8px;cursor:pointer}
.mat input{accent-color:var(--c);width:18px;height:18px}
.mat input:checked+span{text-decoration:line-through;color:var(--mute)}
.q{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px 14px;margin:10px 0}
.q.ok{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.q.no{border-left-color:var(--bad)}
.q p{margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{width:150px;max-width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.opt{padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--c)}
.fb{font-size:.88rem;font-weight:600}.ok .fb{color:var(--ok)}.no .fb{color:var(--bad)}
.score{background:var(--panel);border-radius:12px;padding:14px 16px;margin-top:16px}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.key{display:none;margin-top:6px}
body.teacher .key{display:block}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--c);color:#fff}
.tip{margin-top:16px;padding:10px 14px;border-left:5px solid var(--amb);background:color-mix(in srgb,var(--amb) 14%,transparent);border-radius:0 8px 8px 0;font-size:.9rem}
@media print{header,.tabs,.bar,.score button,.fb{display:none}.q{break-inside:avoid}.opt,.row input{border-color:#888}}
</style>
</head>
<body>
<header><div><h1>Project <b>MATH-LARO</b><br>Worksheets and Answer Keys</h1><p>Pick an activity, check the materials, solve the worksheet, and see your score. Teachers can switch on the answer key.</p></div></header>
<main>
<div class="bar"><label><input type="checkbox" id="tm"> Teacher mode (show answer key)</label><span><button class="btn alt" id="rs">Reset sheet</button> <button class="btn" onclick="window.print()">Print</button></span></div>
<div class="tabs" role="tablist" id="tabs"></div>
<section id="v"></section>
</main>
<script>
const C={NA:["#0f7f74","Number and Algebra"],GE:["#d9480f","Geometry"],ST:["#6f42c1","Statistics and Probability"],PS:["#1c6dd0","Problem Solving"],RV:["#c2255c","Review and Assessment"]};
const A=[
{n:"Math Relay",d:"NA",m:["Problem sheet for each team (5 problems)","Answer key for the captain","Markers or pencils","Timer"],t:"Make two or three different sets so neighboring teams cannot copy.",q:[["Solve x + 9 = 21. x = ?",["12"]],["Solve 3x - 5 = 16. x = ?",["7"]],["Solve 2(x + 4) = 3x - 1. x = ?",["9"]],["Solve x/3 + 4 = 10. x = ?",["18"]],["Solve 5x - 2(x - 3) = 24. x = ?",["6"]]]},
{n:"Equation Match",d:"NA",m:["24 cards per group (8 sets of 3)","Envelopes","Scissors","Colored markers for card backs"],t:"Color the backs of each set differently so mixed decks can be separated.",q:[["For y = 2x + 3, find y when x = 4.",["11"]],["A table gives (0, 3), (1, 5), (2, 7). Find y when x = 10.",["23"]],["A ride costs 3 pesos plus 2 pesos per km. Cost for 8 km?",["19"]],["What is the slope of y = 2x + 3?",["2"]]]},
{n:"Problem-Solving Race",d:"PS",m:["4 to 6 word problems","Mini whiteboards or scratch paper","Timer","Scoring sheet"],t:"Reward the best explanation, not the fastest team.",q:[["Ana buys 3 notebooks and 2 pens for 96 pesos. A notebook costs 24 pesos. Price of one pen?",["12"]],["The ratio of boys to girls is 3 : 5 and there are 40 learners. How many boys?",["15"]],["A jeepney fare is 13 pesos. How much do 4 students pay in all?",["52"]],["A rectangle is 12 cm by 5 cm. Find its perimeter in cm.",["34"]]]},
{n:"Factor Bingo",d:"NA",m:["4 by 4 bingo grids","Bank of 20 factored forms on the board","Bean seeds or paper chips","20 expressions to read aloud"],t:"The winner must expand the factors to prove each covered square.",q:[["Factor x^2 + 5x + 6",["(x+2)(x+3)"],["(x+2)(x+3)","(x+1)(x+6)","(x-2)(x-3)"]],["Factor x^2 - 9",["(x-3)(x+3)"],["(x-3)^2","(x-3)(x+3)","(x+9)(x-1)"]],["Factor 2x^2 + 6x",["2x(x+3)"],["2x(x+3)","2(x^2+3)","x(2x+6x)"]],["Factor x^2 - 6x + 9",["(x-3)^2"],["(x-3)(x+3)","(x-3)^2","(x+3)^2"]]]},
{n:"Algebra Tiles Build-It",d:"NA",m:["2 large squares (x^2) per pair","8 rectangles (x) per pair","12 small squares (1) per pair","Scissors and colored paper"],t:"Store tiles in labeled envelopes for reuse next quarter.",q:[["How many x-tiles are in the model of (x + 1)(x + 4)?",["5"]],["How many unit tiles are in (x + 1)(x + 4)?",["4"]],["How many x-tiles are in (x + 3)(x + 1)?",["4"]],["How many unit tiles are in (x + 2)(x + 2)?",["4"]]]},
{n:"Transformation Treasure Map",d:"GE",m:["Coordinate grid paper per pair","Clue cards (4)","Colored pencils","Ruler"],t:"Pairs trade maps and check each other before the teacher checks.",q:[["Start at (2, 3). Translate 4 right and 2 down. New point?",["6,1"]],["Reflect (6, 1) over the y-axis. New point?",["-6,1"]],["Rotate (-6, 1) by 90 degrees counterclockwise about the origin. (x, y) becomes (-y, x).",["-1,-6"]],["Reflect (-1, -6) over the x-axis. New point?",["-1,6"]]]},
{n:"Geometry Scavenger Hunt",d:"GE",m:["Tape measure or meter stick","Protractor","Worksheet and clipboard","6 labeled stations"],t:"Assign one safety monitor per team. No climbing to measure.",q:[["A table is 1.2 m by 0.6 m. Area in square meters?",["0.72",".72"]],["Perimeter of the same table in meters?",["3.6"]],["A box is 20 cm by 15 cm by 10 cm. Volume in cubic cm?",["3000","3,000"]],["A square floor has sides of 6 m. Area in square meters?",["36"]]]},
{n:"Angle Escape Room",d:"GE",m:["4 puzzle cards in numbered envelopes","3-digit lock or paper lock card","Timer","Hint cards"],t:"A hint can cost one point. Give 20 minutes.",q:[["Puzzle 1: complement of 35 degrees?",["55"]],["Puzzle 2: supplement of 112 degrees?",["68"]],["Puzzle 3: a triangle has angles 50 and 60 degrees. Third angle?",["70"]],["Puzzle 4: interior angle of a regular hexagon?",["120"]],["Final code: add all four answers.",["313"]]]},
{n:"Probability Carnival",d:"ST",m:["Coins and dice","Paper spinner with 8 equal sections (3 blue)","Deck of cards","Tally sheets and cups"],t:"Shake dice in small cups to keep noise low.",q:[["P(heads) for one coin toss? (fraction)",["1/2","0.5"]],["P(sum of 7) when two dice are rolled? (fraction)",["1/6","6/36"]],["P(red card) in a standard deck? (fraction)",["1/2","26/52","0.5"]],["Spinner with 8 equal sections, 3 blue. P(blue)?",["3/8","0.375"]]]},
{n:"Data Detectives",d:"ST",m:["Survey slips","Rulers and graph paper","Colored pencils","Calculator (optional)"],t:"Keep surveys non-sensitive. Do not collect personal details.",q:[["Travel times: 10, 15, 15, 20, 40. Find the mean.",["20"]],["Find the median.",["15"]],["Find the mode.",["15"]],["Find the range.",["30"]]]},
{n:"Palengke Math",d:"PS",m:["Price lists (10 items)","Play money","Shopping lists and receipt slips","Stall signs"],t:"Use local prices so learners relate to the numbers.",q:[["3 kg of rice at 56 pesos per kg. Total?",["168"]],["10 percent discount on 168 pesos. Discount amount?",["16.8","16.80"]],["Price after the discount?",["151.2","151.20"]],["Paid 200 pesos. Change?",["48.8","48.80"]]]},
{n:"Laro ng Daan",d:"RV",m:["30-square path on manila paper","Die and tokens","Cards in 3 colors (green, yellow, red)","Answer key"],t:"Rotate one player as the answer checker.",q:[["Green card: simplify 3x + 4x.",["7x"]],["Yellow card: solve 2x + 5 = 17. x = ?",["6"]],["Red card: slope through (1, 2) and (3, 6)?",["2"]],["Green card: 12 / 3 x 2 = ?",["8"]]]},
{n:"Digital Quiz Battle",d:"RV",m:["Quiz of 10 items on Kahoot, Wayground, or Blooket","Projector or phones","ABCD answer cards for offline play","Scoring sheet"],t:"Discuss the wrong answers. Do not rely only on speed.",q:[["Slope of the line through (1, 2) and (3, 6)?",["2"]],["Solve 4x - 3 = 13. x = ?",["4"]],["Which is a factor of x^2 - 16?",["x-4"],["x-4","x+8","x-8"]]]}
];
let cur=0;const R=A.map(a=>a.q.map(()=>null));
const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().replace(/[\s()]/g,"").replace(/,$/,"");
const same=(g,a)=>{const x=norm(g),y=norm(a);if(x===y)return true;const n=parseFloat(x),m=parseFloat(y);return x!==""&&!isNaN(n)&&!isNaN(m)&&/^-?[\d.]+$/.test(x)&&/^-?[\d.]+$/.test(y)&&Math.abs(n-m)<1e-9};
function tabs(){$("#tabs").innerHTML=A.map((a,i)=>`<button class="tab" role="tab" aria-selected="${i==cur}" style="--c:${C[a.d][0]}" data-i="${i}">${i+1}. ${a.n}</button>`).join("");}
function view(){
  const a=A[cur],c=C[a.d];
  $("#v").style.setProperty("--c",c[0]);
  $("#v").innerHTML=`<div class="banner"><div class="no">${cur+1}</div><div><small>${c[1]}</small><h2>${a.n}</h2></div></div>
  <div class="id"><input placeholder="Name" aria-label="Name"><input placeholder="Section" aria-label="Section"></div>
  <h3>Materials checklist</h3><ul class="mat">${a.m.map(x=>`<li><label><input type="checkbox"><span>${x}</span></label></li>`).join("")}</ul>
  <h3>Worksheet</h3>${a.q.map((q,j)=>`<div class="q" id="q${j}"><p>${j+1}. ${q[0]}</p>${q[2]?`<div class="row">${q[2].map(o=>`<button class="opt" data-j="${j}" data-v="${o}">${o}</button>`).join("")}</div>`:`<div class="row"><input id="i${j}" placeholder="Answer" aria-label="Answer ${j+1}"><button class="btn" data-ck="${j}">Check</button></div>`}<div class="fb" id="f${j}" aria-live="polite"></div></div>`).join("")}
  <div class="score"><b id="sc"></b><div class="meter"><i id="mt"></i></div></div>
  <div class="key"><h3>Answer key</h3><table><tr><th>#</th><th>Answer</th></tr>${a.q.map((q,j)=>`<tr><td>${j+1}</td><td>${q[1][0]}</td></tr>`).join("")}</table></div>
  <div class="tip"><b>Teacher tip:</b> ${a.t}</div>`;
  a.q.forEach((q,j)=>paint(j));score();
}
function paint(j){const r=R[cur][j],el=$("#q"+j);if(!el)return;el.className="q"+(r===true?" ok":r===false?" no":"");$("#f"+j).textContent=r===true?"Correct!":r===false?"Not yet. Check your work and try again.":"";}
function score(){const n=R[cur].filter(x=>x===true).length,t=A[cur].q.length;$("#sc").textContent=`Score: ${n} / ${t}${n==t?"  Great work! All correct.":""}`;$("#mt").style.width=(100*n/t)+"%";}
function judge(j,g){R[cur][j]=A[cur].q[j][1].some(a=>same(g,a));paint(j);score();}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){cur=+t.dataset.i;tabs();view();return}
  const ck=e.target.closest("[data-ck]");if(ck){const j=+ck.dataset.ck;judge(j,$("#i"+j).value);return}
  const o=e.target.closest(".opt");if(o)judge(+o.dataset.j,o.dataset.v);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id[0]==="i"&&e.target.id.length<4)judge(+e.target.id.slice(1),e.target.value)});
$("#tm").onchange=e=>document.body.classList.toggle("teacher",e.target.checked);
$("#rs").onclick=()=>{R[cur]=A[cur].q.map(()=>null);view()};
tabs();view();
</script>
</body>
</html>
